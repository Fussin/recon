# AUTONOMOUSPEN AI Configuration

scanner:
  name: "AUTONOMOUSPEN AI"
  version: "1.0.0"
  mode: "autonomous"

  # Scanning configuration
  scan:
    timeout: "24h"
    max_concurrent_scans: 100
    max_workers_per_scan: 50
    rate_limit: 1000 # requests per minute
    user_agent: "AUTONOMOUSPEN/1.0"
    follow_redirects: true
    max_redirects: 10

  # Vulnerability modules
  modules:
    xss:
      enabled: true
      timeout: "5m"
      max_payloads: 500
      validate_with_browser: true

    sqli:
      enabled: true
      timeout: "10m"
      test_all_parameters: true
      blind_detection: true

    ssrf:
      enabled: true
      timeout: "5m"
      callback_url: "https://callback.autonomouspen.ai"
      test_internal_networks: true

    rce:
      enabled: true
      timeout: "10m"
      safe_mode: true # Don't execute destructive commands

    # ... other modules

  # AI configuration
  ai:
    decision_engine:
      enabled: true
      model: "gpt-4"
      temperature: 0.7
      max_tokens: 2000

    payload_generation:
      enabled: true
      learning_enabled: true
      success_threshold: 0.7

  # Bug bounty platforms
  platforms:
    hackerone:
      enabled: true
      api_key: "${HACKERONE_API_KEY}"
      username: "autonomouspen"
      auto_submit: false

    bugcrowd:
      enabled: true
      api_key: "${BUGCROWD_API_KEY}"
      auto_submit: false

  # Database configuration
  database:
    type: "postgresql"
    host: "localhost"
    port: 5432
    name: "autonomouspen"
    user: "scanner"
    password: "${DB_PASSWORD}"
    max_connections: 100

  # Redis configuration
  redis:
    host: "localhost"
    port: 6379
    password: "${REDIS_PASSWORD}"
    db: 0

  # Blockchain configuration
  blockchain:
    enabled: true
    network: "polygon"
    rpc_url: "${BLOCKCHAIN_RPC_URL}"
    contract_address: "${REGISTRY_CONTRACT_ADDRESS}"
    private_key: "${SCANNER_PRIVATE_KEY}"
    gas_limit: 3000000

  # IPFS configuration
  ipfs:
    enabled: true
    api_url: "http://localhost:5001"
    gateway_url: "https://ipfs.io"

  # Monitoring
  monitoring:
    prometheus:
      enabled: true
      port: 9090

    grafana:
      enabled: true
      port: 3000

  # Security
  security:
    tls:
      enabled: true
      cert_file: "/certs/cert.pem"
      key_file: "/certs/key.pem"

    authentication:
      jwt_secret: "${JWT_SECRET}"
      session_timeout: "24h"
