version: '3.8'

services:
  # Core scanner service
  scanner:
    build:
      context: .
      dockerfile: docker/scanner/Dockerfile
    image: autonomouspen/scanner:latest
    container_name: autonomouspen_scanner
    restart: unless-stopped
    environment:
      - CONFIG_FILE=/config/config.yaml
      - LOG_LEVEL=info
    volumes:
      - ./config:/config:ro
      - ./reports:/reports
      - scanner_data:/data
    networks:
      - autonomouspen
    depends_on:
      - postgres
      - redis
      - ipfs
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # API service
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: autonomouspen/api:latest
    container_name: autonomouspen_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://scanner:${DB_PASSWORD}@postgres/autonomouspen
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - autonomouspen
    depends_on:
      - postgres
      - redis

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: autonomouspen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autonomouspen
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - autonomouspen
    ports:
      - "5432:5432"

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: autonomouspen_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - autonomouspen
    ports:
      - "6379:6379"

  # IPFS node
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: autonomouspen_ipfs
    restart: unless-stopped
    volumes:
      - ipfs_data:/data/ipfs
    ports:
      - "5001:5001"
      - "8081:8080"
    networks:
      - autonomouspen

  # Blockchain node (optional local node)
  ganache:
    image: trufflesuite/ganache:latest
    container_name: autonomouspen_ganache
    restart: unless-stopped
    ports:
      - "8545:8545"
    command: -a 10 --deterministic --host 0.0.0.0
    networks:
      - autonomouspen

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: autonomouspen_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - autonomouspen

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: autonomouspen_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - autonomouspen

networks:
  autonomouspen:
    driver: bridge

volumes:
  scanner_data:
  postgres_data:
  redis_data:
  ipfs_data:
  prometheus_data:
  grafana_data:
