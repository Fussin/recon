apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autonomouspen-ai-ingress
  namespace: autonomouspen-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: scanner
            port:
              number: 8080
